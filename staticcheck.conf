# staticcheck's default check set, minus S1016.
#
# S1016 (use a type conversion instead of a struct literal) is disabled on
# purpose: HTTP request DTOs are kept separate from the domain input DTOs so the
# transport layer and the domain can evolve independently, even where their
# fields currently coincide. Explicit field mapping in handlers is intentional.
checks = ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022", "-S1016"]
