syntax = "proto3";

package maintainerd.secret.v1;

// Client stubs generated INTO core: core is the controller that drives secret's
// SetupService, exactly as it drives auth's. Kept in sync with
// maintainerd-secret/proto/maintainerd/secret/v1/secret.proto.
//
// THIS IS A TRIMMED COPY, and deliberately so. Secret declares SecretService and
// SetupService in one file; core drives only the latter, and generating the ~100
// message types of the data plane would ship a large surface core must never
// call — the vault is reached over REST (internal/secretctrl), not gRPC. The
// package name, service name, method names and every field number below are
// byte-identical to secret's file, which is what keeps the wire compatible; the
// omissions are whole top-level declarations, which protobuf ignores on both
// sides.
option go_package = "github.com/maintainerd/core/gen/maintainerd/secret/v1;secretv1";

// SetupService is the CONTROLLED setup path: a controller (Core) drives it with
// the bootstrap token in the x-setup-token metadata header. Once it has completed
// setup, secret's REST wizard refuses — an instance has exactly one setup path.
service SetupService {
  rpc GetSetupStatus(GetSetupStatusRequest) returns (GetSetupStatusResponse);
  // Setup creates the tenant mirror plus the default project and environment. It
  // is idempotent: a retry after a lost response converges instead of reporting a
  // conflict that reads as "somebody else claimed this instance".
  rpc Setup(SetupServiceSetupRequest) returns (SetupServiceSetupResponse);
  // CompleteSetup closes the one-time window permanently.
  rpc CompleteSetup(CompleteSetupRequest) returns (CompleteSetupResponse);
}

message GetSetupStatusRequest {}
message GetSetupStatusResponse {
  // completed is the only field an unauthenticated caller receives. Everything
  // else requires the setup token or secret:Admin.
  bool completed = 1;
  string controller = 2;
  string controller_kind = 3;
  string mode = 4;
  string completed_at = 5;
  string tenant = 6;
  string auth_tenant_uuid = 7;
  string project = 8;
  string environment = 9;
  // permissions is what secret ENFORCES, reported so a controller registers
  // exactly that and cannot drift from it.
  repeated string permissions = 10;
  bool rest_wizard_open = 11;
}

message SetupServiceSetupRequest {
  string tenant = 1;
  string tenant_display_name = 2;
  // auth_tenant_uuid links secret's mirror to the Auth tenant this instance
  // serves.
  string auth_tenant_uuid = 3;
  string project = 4;
  string environment = 5;
  // controller identifies the driving service; recorded on the durable lock.
  string controller = 6;
}
message SetupServiceSetupResponse {
  string tenant_uuid = 1;
  string tenant = 2;
  string project = 3;
  string environment = 4;
  bool already_existed = 5;
  repeated string permissions = 6;
}

message CompleteSetupRequest {
  string controller = 1;
}
message CompleteSetupResponse {
  bool completed = 1;
  string controller = 2;
  string controller_kind = 3;
}
